name: Release

# Publish a GitHub release whose tag matches the manifest version (e.g. v0.1.0)
# to build it, attach the zips and submit it to the stores.
# Signing on addons.mozilla.org is optional: it runs only when the
# AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are set. The AMO_CHANNEL
# repository variable picks the channel ("listed" by default, or "unlisted").
# The Chrome zip is built after the Firefox steps and can't hold them up. Uploading
# it to the Chrome Web Store is optional: it runs only when the CWS_EXTENSION_ID,
# CWS_PUBLISHER_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET and CWS_REFRESH_TOKEN secrets
# are set, after the zips are attached to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'listed' }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the extension version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p 'require("./manifest.json").version')
          pkg=$(node -p 'require("./package.json").version')
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($manifest) and package.json ($pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Sign on addons.mozilla.org
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          args=(--channel "$AMO_CHANNEL" --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET")
          # Listed versions go through AMO review; don't block the job on it.
          if [ "$AMO_CHANNEL" = "listed" ]; then args+=(--approval-timeout 0); fi
          npx web-ext sign "${args[@]}"

      - name: Build for Chrome
        id: chrome
        continue-on-error: true
        run: npm run build:chrome

      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber \
            web-ext-artifacts/*.zip web-ext-artifacts/*.xpi

      - name: Upload to the Chrome Web Store
        if: >-
          steps.chrome.outcome == 'success' && env.CWS_EXTENSION_ID != '' && env.CWS_PUBLISHER_ID != '' &&
          env.CWS_CLIENT_ID != '' && env.CWS_CLIENT_SECRET != '' && env.CWS_REFRESH_TOKEN != ''
        continue-on-error: true
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        # Uploads and submits for review; the store publishes it once approved.
        run: npx --yes chrome-webstore-upload-cli@4.0.2 --source "web-ext-artifacts/synthid_check-chrome-${GITHUB_REF_NAME#v}.zip"
